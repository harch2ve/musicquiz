<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>단소·소금 운지법 연습</title>
<style>
:root{--bg:#faf7f2;--fg:#2a2420;--card:#fff;--mut:#8a7f75;--ac:#8b5a2b;--ok:#2e8b57;--no:#d1453b;--ln:#e3dbd0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1917;--fg:#f0e9e0;--card:#292422;--mut:#a89d92;--ac:#d9a066;--ln:#3d3631}}
*{box-sizing:border-box;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;max-width:560px;margin:0 auto;padding:16px 8px 40px}
h1{font-size:22px;text-align:center;margin:28px 0 6px}
p.s{text-align:center;color:var(--mut);margin:0 0 28px;font-size:14px}
.big{display:block;width:calc(100% - 16px);margin:0 8px 14px;padding:26px;border:1px solid var(--ln);border-radius:16px;background:var(--card);color:var(--fg);font-size:22px;font-weight:700;cursor:pointer}
.big small{display:block;font-size:13px;font-weight:400;color:var(--mut);margin-top:6px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mut);padding:0 6px}
.top button{background:none;border:none;color:var(--ac);font-size:14px;cursor:pointer;padding:6px}
.ttl{text-align:center;font-size:18px;font-weight:700;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:10px 6px}
.g{display:grid;gap:5px 3px;align-items:center;justify-items:center}
.gh{font-size:11px;color:var(--mut);border-bottom:2px solid var(--ln);width:100%;text-align:center;padding-bottom:2px}
.nm{font-weight:700;line-height:1.1}.hj{color:var(--mut);line-height:1.1}
.nm.ok{color:var(--ok)}.nm.no{color:var(--no)}
.hl{font-size:11px;color:var(--mut)}
.b{width:100%;max-width:34px;aspect-ratio:1;border-radius:50%;border:2px solid var(--fg);background:transparent;padding:0;cursor:pointer}
.b.on{background:var(--fg)}
.b.w{border-color:var(--no);box-shadow:0 0 0 2px var(--no)}
.b.w.on{background:var(--no)}
.leg{font-size:12px;color:var(--mut);margin:12px 8px 0;line-height:1.7}
.res{text-align:center;font-weight:700;margin:12px 0 0;min-height:24px}
.act{display:flex;gap:10px;margin:12px 8px 0}
.act button{flex:1;padding:15px;border-radius:12px;border:none;font-size:16px;font-weight:700;background:var(--ac);color:#fff;cursor:pointer}
.act button.x{background:var(--card);color:var(--fg);border:1px solid var(--ln)}
.g{touch-action:none}
.mode{display:flex;gap:8px;justify-content:center;margin:0 0 10px}
.mode button{padding:8px 16px;border-radius:99px;border:1px solid var(--ln);background:var(--card);color:var(--fg);font-size:14px;cursor:pointer}
.mode button.s{background:var(--ac);border-color:var(--ac);color:#fff}
.tip{text-align:center;font-size:12px;color:var(--mut);margin:0 0 8px}
.qc{touch-action:none;padding:4px 14px}
.qr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--ln)}
.qr:last-child{border:none}
.qr .lb{font-size:15px}.qr .lb small{display:block;color:var(--mut);font-size:12px}
.qr .b{width:48px;max-width:none;flex:none}
.qn{text-align:center;margin:14px 0 2px;font-size:56px;font-weight:800;color:var(--ac);line-height:1.1}
.qn small{display:block;font-size:30px;color:var(--mut);font-weight:400}
.qt{text-align:center;color:var(--mut);font-size:14px;margin-bottom:12px}
.hg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 8px 22px}
.hg .big{width:auto;margin:0;padding:22px 8px}
.sec{font-size:14px;color:var(--mut);margin:0 10px 8px;font-weight:700}
</style></head><body><div id="app"></div>
<script>
const DATA={
danso:{name:'단소',fs:16,holes:['제1공 왼손 엄지','제2공 왼손 집게','제3공 왼손 가운데','제4공 오른손 가운데','제5공 거의 사용 안 함'],
groups:[['낮은 소리',5],['높은 소리',5]],
notes:[['중','仲','11110'],['임','林','11100'],['무','無','11000'],['황','潢','10000'],['태','汰','00000'],
['중','㳞','11110'],['임','淋','11100'],['무','潕','11000'],['황','㶂','10000'],['태','㳲','10100']]},
sogeum:{name:'소금',fs:12,holes:['제1공 왼손 집게','제2공 왼손 가운뎃','제3공 왼손 약손','제4공 오른손 집게','제5공 오른손 가운뎃','제6공 오른손 약손'],
groups:[['저취',6],['평취',7],['역취',3]],
notes:[['임','林','111111'],['남','南','111110'],['무','無','111101'],['황','潢','111000'],['태','汰','110000'],['고','㴌','100000'],
['중','㳞','011001'],['임','淋','011111'],['남','湳','111110'],['무','潕','111101'],['황','㶂','111000'],['태','㳲','110000'],['고','㵈','100011'],
['중','㴢','000111'],['임','㵉','011001'],['남','㵜','110001']]}};
let inst,marks,checked,deck,qi,score,painting=false,pv=0;
const $=document.getElementById('app');
function home(){$.innerHTML=`<h1>🪈 운지법 익히기 🎶</h1><p class="s">🎼 연습 방식을 선택하세요</p>
<div class="sec">📝 표 전체 채우기</div>
<div class="hg"><button class="big" onclick="start('danso')">🪈 단소<small>10개 음</small></button><button class="big" onclick="start('sogeum')">🎵 소금<small>16개 음</small></button></div>
<div class="sec">🎲 랜덤 문제 (율명 하나씩)</div>
<div class="hg"><button class="big" onclick="startQ('danso')">🪈 단소<small>🎲 랜덤</small></button><button class="big" onclick="startQ('sogeum')">🎵 소금<small>🎲 랜덤</small></button></div>`;}
function mk(){const d=DATA[inst];marks=d.notes.map(()=>d.holes.map(()=>0));checked=false;}
function start(k){inst=k;reset();}
function reset(){mk();draw();}
function draw(){
 const d=DATA[inst],n=d.notes.length,H=d.holes.length;let c='',score=0;
 c+=`<div></div>`;d.groups.forEach(([l,k])=>c+=`<div class="gh" style="grid-column:span ${k}">${l}</div>`);
 const colOk=d.notes.map((x,j)=>x[2].split('').every((a,i)=>+a===marks[j][i]));
 if(checked)score=colOk.filter(Boolean).length;
 const cls=j=>checked?(colOk[j]?' ok':' no'):'';
 c+=`<div class="hl">율명</div>`+d.notes.map((x,j)=>`<div class="nm${cls(j)}">${x[0]}</div>`).join('');
 c+=`<div class="hl">한자</div>`+d.notes.map(x=>`<div class="hj">${x[1]}</div>`).join('');
 for(let i=0;i<H;i++){
  c+=`<div class="hl">${i+1}공</div>`;
  d.notes.forEach((x,j)=>{const a=+x[2][i],m=marks[j][i];
   const on=checked?a:m;const w=checked&&a!==m;
   c+=`<button class="b${on?' on':''}${w?' w':''}" data-j="${j}" data-i="${i}"></button>`;});
 }
 const leg=d.holes.map(h=>h.replace(' ',' : ')).join(' · ');
 $.innerHTML=`<div class="top"><button onclick="home()">🏠 처음으로</button><span>${d.name}</span></div>
 <div class="ttl">🎼 ${d.name} 운지법 🎶</div>
 <div class="tip">👆 눌러서 채우거나, 누른 채 밀어서 색칠하세요</div>
 <div class="card"><div class="g" style="grid-template-columns:24px repeat(${n},1fr);font-size:${d.fs}px">${c}</div></div>
 <div class="leg">채우면 ● 막기, 비워두면 ○ 열기<br>${leg}</div>
 <div class="res" style="color:${score===n?'var(--ok)':'var(--no)'}">${checked?`${n}개 중 ${score}개 정답`+(score===n?' 🎉✨':' 😅 · 빨간 테두리가 틀린 곳(정답 표시)'):''}</div>
 <div class="act">${checked?`<button onclick="reset()">🔁 다시 풀기</button>`:`<button class="x" onclick="reset()">🧹 초기화</button><button onclick="chk()">✅ 채점</button>`}</div>`;
}
function chk(){checked=true;draw();}
function startQ(k){inst=k;mk();const d=DATA[k];deck=d.notes.map((_,i)=>i).sort(()=>Math.random()-.5);qi=0;score=0;drawQ();}
function drawQ(){
 const d=DATA[inst],j=deck[qi],x=d.notes[j],H=d.holes.length,N=deck.length;
 const tags=[];d.groups.forEach(([l,k])=>{for(let q=0;q<k;q++)tags.push(l)});
 const ok=checked&&x[2].split('').every((a,i)=>+a===marks[j][i]);
 const rows=d.holes.map((h,i)=>{const a=+x[2][i],m=marks[j][i],on=checked?a:m,w=checked&&a!==m;const[p,q]=h.split(' ');
  return `<div class="qr"><div class="lb">${p}<small>${h.slice(p.length+1)}</small></div><button class="b${on?' on':''}${w?' w':''}" data-j="${j}" data-i="${i}"></button></div>`}).join('');
 const last=qi===N-1;
 $.innerHTML=`<div class="top"><button onclick="home()">🏠 처음으로</button><span>${d.name} · ${qi+1} / ${N} · 정답 ${score}</span></div>
 <div class="qn">${x[0]}<small>${x[1]}</small></div><div class="qt">🎵 ${d.name} · ${tags[j]}</div>
 <div class="card qc">${rows}</div>
 <div class="leg" style="text-align:center">눌러서 채우거나 밀어서 색칠 · 채우면 ● 막기, 비워두면 ○ 열기</div>
 <div class="res" style="color:${ok?'var(--ok)':'var(--no)'}">${checked?(ok?'정답입니다! 🎉':'앗, 틀렸어요 😅 · 빨간 테두리가 정답 표시'):''}</div>
 <div class="act">${checked?`<button onclick="nextQ()">${last?'🏆 결과 보기':'다음 문제 ➡️'}</button>`:`<button class="x" onclick="clrQ()">🧹 초기화</button><button onclick="chkQ()">✅ 채점</button>`}</div>`;
}
function clrQ(){marks[deck[qi]]=DATA[inst].holes.map(()=>0);drawQ();}
function chkQ(){const j=deck[qi];checked=true;if(DATA[inst].notes[j][2].split('').every((a,i)=>+a===marks[j][i]))score++;drawQ();}
function nextQ(){if(qi===deck.length-1){finQ();return;}qi++;checked=false;drawQ();}
function finQ(){const N=deck.length;
 $.innerHTML=`<h1>🏆 결과</h1><p class="s">🎲 ${DATA[inst].name} 랜덤 문제</p><div class="qn">${score} / ${N}</div><div class="qt">${score===N?'완벽해요! 🎉👏':'한 번 더 도전해 보세요 💪'}</div>
 <div class="act"><button class="x" onclick="home()">🏠 처음으로</button><button onclick="startQ(inst)">🔁 다시 하기</button></div>`;}
function setCell(b){if(checked||!b)return;const j=+b.dataset.j,i=+b.dataset.i;
 if(marks[j][i]!==pv){marks[j][i]=pv;b.classList.toggle('on',!!pv);}}
document.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('.b');
 if(!b||checked)return;e.preventDefault();painting=true;pv=marks[+b.dataset.j][+b.dataset.i]?0:1;setCell(b);});
document.addEventListener('pointermove',e=>{if(!painting)return;
 const el=document.elementFromPoint(e.clientX,e.clientY),b=el&&el.closest&&el.closest('.b');if(b)setCell(b);});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>{painting=false}));
home();
</script></body></html>
